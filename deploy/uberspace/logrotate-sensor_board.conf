# Access/error log rotation for DIY Sensor.
#
# The access log records IP addresses, which are personal data. Keeping them
# indefinitely has no operational justification and would contradict the privacy
# notice, so this caps retention at 30 days.
#
# Rotating daily and keeping 30 files, rather than rotating monthly, makes that
# a hard ceiling: with monthly rotation a request logged on the 1st survives
# until the end of the *next* month, which is nearly twice as long as the notice
# promises.
#
# Install (Uberspace, as your own user):
#   mkdir -p ~/etc/logrotate.d
#   cp deploy/uberspace/logrotate-sensor_board.conf ~/etc/logrotate.d/sensor_board.conf
#   # edit the paths below if your checkout is not ~/sensor_board
#
# Then run it once a day. Uberspace has no per-user logrotate cron, so add one
# with `crontab -e` (logrotate needs its own state file as a normal user):
#   17 4 * * * /usr/sbin/logrotate -s "$HOME/.logrotate.state" "$HOME/etc/logrotate.d/sensor_board.conf"
#
# Check it without waiting a day:
#   /usr/sbin/logrotate -d -s ~/.logrotate.state ~/etc/logrotate.d/sensor_board.conf   # dry run
#   /usr/sbin/logrotate -f -s ~/.logrotate.state ~/etc/logrotate.d/sensor_board.conf   # force once

/home/*/sensor_board/access.log
/home/*/sensor_board/errors.log {
    daily
    rotate 30
    # gunicorn holds the file open and is not signalled here, so the file must
    # keep its inode: copy it aside, then truncate in place. A few lines written
    # during the copy can be lost, which is the accepted cost of not restarting
    # the service to rotate a log.
    copytruncate
    compress
    delaycompress
    missingok
    notifempty
    # Rotated copies still contain IP addresses; keep them off other accounts.
    create 0600
}
